[package]
name = "desktop-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
calamine = "0.26"
cfb = "0.7"
csv = "1.3"
encoding_rs = "0.8"
quick-xml = "0.37"
zip = "2.2"

[dev-dependencies]
tempfile = "3"
