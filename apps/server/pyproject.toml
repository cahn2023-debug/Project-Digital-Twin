[project]
name = "project-digital-twin-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
