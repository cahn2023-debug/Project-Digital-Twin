[package]
name = "project-digital-twin-desktop"
version = "0.1.0"
description = "Project Digital Twin desktop shell"
authors = ["Project Digital Twin"]
edition = "2021"

[lib]
name = "project_digital_twin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop-core = { path = "../../../crates/desktop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
